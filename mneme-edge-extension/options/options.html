<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>mneme memory bridge 设置</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 18px; }
    h2 { font-size: 14px; margin-top: 22px; border-top: 1px solid #eee; padding-top: 14px; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 13px; }
    input[type="text"], input[type="password"] { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    .checks label, .radios label { display: flex; align-items: center; gap: 8px; font-weight: normal; font-size: 14px; margin: 8px 0; }
    .row { margin-top: 18px; display: flex; gap: 10px; }
    button { padding: 8px 16px; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; cursor: pointer; }
    button.ghost { background: #fff; color: #2563eb; }
    #status { margin-top: 14px; font-size: 13px; min-height: 20px; white-space: pre-wrap; }
    .hint { font-size: 12px; color: #666; margin: 4px 0; }
  </style>
</head>
<body>
  <h1>mneme memory bridge 设置</h1>
  <label for="bridgeUrl">Bridge 地址</label>
  <input type="text" id="bridgeUrl" placeholder="http://127.0.0.1:8760" />
  <label for="token">访问 Token（mneme-bridge/config.json 的 bridgeToken）</label>
  <input type="password" id="token" placeholder="留空则不带鉴权头" />
  <p class="hint">提示：v0.2 需配合 bridge v0.2 才有全局记忆（画像/规则/高价值）；旧 bridge 下自动降级为相关记忆检索。</p>
  <h2>注入方式</h2>
  <div class="radios">
    <label><input type="radio" name="injectMode" value="implicit" checked /> 隐式注入（推荐）：记忆直接拼进请求，输入框无感</label>
    <label><input type="radio" name="injectMode" value="visible" /> 可见注入：发送前把记忆块插进输入框（能看到、可删除）</label>
  </div>
  <div class="checks">
    <label><input type="checkbox" id="injectEnabled" /> 启用记忆注入</label>
    <label><input type="checkbox" id="collectEnabled" /> 自动收集对话</label>
    <label><input type="checkbox" id="debug" /> 调试模式（Console 输出 [mneme] 日志）</label>
  </div>
  <h2>旧会话导入</h2>
  <label for="maxImportSessions">最大导入会话数（1~200，默认 20）</label>
  <input type="text" id="maxImportSessions" placeholder="20" />
  <label for="maxImportChars">导入总字符量闸（10000~2000000，默认 50000）</label>
  <input type="text" id="maxImportChars" placeholder="1500000" />
  <div class="row">
    <button id="save">保存</button>
    <button id="ping" class="ghost">测试连通</button>
  </div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
